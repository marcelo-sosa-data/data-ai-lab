[project]
name = "text2sql"
version = "0.1.0"
description = "Agente que responde preguntas de negocio en español consultando una base con SQL"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "duckdb>=1.1",
    "sqlglot>=25",
    "numpy>=1.26",
    "pandas>=2.1",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
text2sql = "text2sql.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
