[project]
name = "matricula"
version = "0.1.0"
description = "Pipeline de matrícula universitaria con dbt y DuckDB, con tests de calidad y dashboard"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
matricula = "matricula.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
