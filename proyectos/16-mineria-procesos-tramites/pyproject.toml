[project]
name = "tramites"
version = "0.1.0"
description = "Minería de procesos sobre el log de trámites académicos y simulación de cambios en el orden de aprobaciones"
requires-python = ">=3.11"
dependencies = [
    "pm4py>=2.7.19",
    "simpy>=4.1",
    "duckdb>=1.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.45", "altair>=5.4"]
dev = ["pytest>=8"]

[project.scripts]
tramites = "tramites.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::PendingDeprecationWarning", "ignore::DeprecationWarning"]
