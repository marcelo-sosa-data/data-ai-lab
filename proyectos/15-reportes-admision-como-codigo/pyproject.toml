[project]
name = "admision"
version = "0.1.0"
description = "Reportes de admisión como código: exports a DuckDB, pruebas de datos y sitio en Evidence"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
admision = "admision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
