[project]
name = "semantico"
version = "0.1.0"
description = "Modelo semántico de matrícula en TMDL con pruebas de medidas DAX, reglas y despliegue por ambientes"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
publicar = ["fabric-cicd>=0.1.20", "azure-identity>=1.17", "python-dotenv>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
semantico = "semantico.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
