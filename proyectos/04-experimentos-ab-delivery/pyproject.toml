[project]
name = "experimentos"
version = "0.1.0"
description = "Lectura de experimentos A/B: SRM, CUPED, método delta, lectura secuencial y regla de decisión"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
experimentos = "experimentos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
