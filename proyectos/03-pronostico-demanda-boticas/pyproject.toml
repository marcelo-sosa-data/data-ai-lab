[project]
name = "demanda"
version = "0.1.0"
description = "Pronóstico de demanda diaria por local y producto, intervalos conformal y simulación de reposición"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.3",
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
demanda = "demanda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
