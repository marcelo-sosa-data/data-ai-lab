[project]
name = "pedidos_rt"
version = "0.1.0"
description = "Métricas operativas por zona y minuto a partir de los eventos de pedidos en Kafka, con alerta de saturación"
requires-python = ">=3.10"
dependencies = [
    "quixstreams>=3.20",
    "confluent-kafka>=2.6",
    "duckdb>=1.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=17",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
pedidos-rt = "pedidos_rt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["kafka: necesita un broker (KAFKA_BROKER); se salta si no hay"]
