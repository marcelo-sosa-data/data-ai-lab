[project]
name = "reclamos"
version = "0.1.0"
description = "Agente de reclamos de una fintech con herramientas MCP, permisos por herramienta, guardrails y evaluación offline"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "openai>=1.50",
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5.4"]
dev = ["pytest>=8"]

[project.scripts]
reclamos = "reclamos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
